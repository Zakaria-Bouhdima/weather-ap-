apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: weatherapp-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: weatherapp.availability
      interval: 30s
      rules:
        # SLO: 99.5% of requests must succeed (error budget: 0.5%)
        - alert: WeatherServiceHighErrorRate
          expr: |
            sum(rate(flask_http_request_total{status=~"5.."}[5m]))
            /
            sum(rate(flask_http_request_total[5m])) > 0.005
          for: 5m
          labels:
            severity: critical
            service: weather
          annotations:
            summary: "Weather service error rate above SLO (>0.5%)"
            description: "Current error rate: {{ $value | humanizePercentage }}"

        - alert: AuthServiceHighErrorRate
          expr: |
            sum(rate(gin_requests_total{code=~"5.."}[5m]))
            /
            sum(rate(gin_requests_total[5m])) > 0.005
          for: 5m
          labels:
            severity: critical
            service: auth
          annotations:
            summary: "Auth service error rate above SLO (>0.5%)"
            description: "Current error rate: {{ $value | humanizePercentage }}"

    - name: weatherapp.latency
      interval: 30s
      rules:
        # SLO: p95 latency must be below 500ms
        - alert: WeatherServiceHighLatency
          expr: |
            histogram_quantile(0.95,
              rate(flask_http_request_duration_seconds_bucket[5m])
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            service: weather
          annotations:
            summary: "Weather service p95 latency above 500ms"
            description: "p95 latency: {{ $value | humanizeDuration }}"

        - alert: AuthServiceHighLatency
          expr: |
            histogram_quantile(0.95,
              rate(gin_request_duration_seconds_bucket[5m])
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            service: auth
          annotations:
            summary: "Auth service p95 latency above 500ms"
            description: "p95 latency: {{ $value | humanizeDuration }}"

    - name: weatherapp.kubernetes
      interval: 60s
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace="default"
            }[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "{{ $labels.pod }} restarted {{ $value }} times in 15 minutes"

        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{
              namespace="default",
              condition="true"
            } == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="default"}
            != kube_deployment_status_replicas_available{namespace="default"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} has unavailable replicas"

    - name: weatherapp.nginx
      interval: 30s
      rules:
        - alert: NginxDown
          expr: nginx_up == 0
          for: 1m
          labels:
            severity: critical
            service: nginx
          annotations:
            summary: "Nginx is down"
